[workspace]
resolver = "3"
members = ["crates/dw4core", "crates/dw4ipc", "crates/dw4cli"]
# webkit2gtk-4.1 is not available in every build environment, and a member that
# cannot compile would break the whole workspace gate. CI (or a developer host)
# builds this crate in a job that installs the system dependencies.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/crashbashash/DW4orge"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
