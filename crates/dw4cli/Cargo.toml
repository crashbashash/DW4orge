[package]
name = "dw4cli"
description = "Headless CLI for Digimon World 4 save files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dw4cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
dw4core = { path = "../dw4core" }
dw4ipc = { path = "../dw4ipc" }
serde = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
