[package]
name = "dw4core"
description = "Digimon World 4 (USA, SLUS_208.36) save-format engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# TypeScript binding derives. Off by default so the core's dependency set is
# unchanged; dw4ipc turns it on.
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"
