[package]
name = "dw4ipc"
description = "IPC payloads and the shared service layer for DW4orge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
dw4core = { path = "../dw4core", features = ["ts"] }
serde = { version = "1", features = ["derive"] }
# The `fixtures` module renders the browser mock's JSON; the same crate is used
# by the drift test, so it is a normal dependency rather than a dev-only one.
serde_json = "1"
ts-rs = "12"

[dev-dependencies]
tempfile = "3"
